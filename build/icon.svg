<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4236"/>
      <stop offset="1" stop-color="#0c1d17"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b83d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5b83d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824px rounded square on a 1024px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <!-- The cue card: a chalk card with the amber bar down its left edge, as
       replies look in the app, and two lines of text to say. -->
  <rect x="228" y="330" width="568" height="380" rx="44" fill="#e9f0ea"/>
  <rect x="228" y="330" width="58" height="380" rx="29" fill="#f5b83d"/>
  <rect x="268" y="330" width="40" height="380" fill="#e9f0ea"/>
  <rect x="352" y="438" width="356" height="52" rx="26" fill="#10241d"/>
  <rect x="352" y="550" width="244" height="52" rx="26" fill="#10241d" fill-opacity="0.45"/>
  <!-- The call lamp, lit. -->
  <circle cx="742" cy="262" r="110" fill="url(#lampGlow)"/>
  <circle cx="742" cy="262" r="46" fill="#f5b83d"/>
</svg>
